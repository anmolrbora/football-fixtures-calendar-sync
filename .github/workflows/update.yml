name: Update fixtures

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate liverpool.ics
        run: python3 generate_ics.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet liverpool.ics; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add liverpool.ics
            git commit -m "Update fixtures"
            git push
          else
            echo "No fixture changes"
          fi
